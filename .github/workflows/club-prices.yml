name: Check club entry prices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-price-import
  cancel-in-progress: false
jobs:
  prices:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/club-price-import.test.mjs
      - name: Check official prices
        run: node scripts/club-price-import.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
