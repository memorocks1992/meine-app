<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" role="img" aria-labelledby="title desc">
  <title id="title">Queue Berlin x Berliner Pilsner – mobiler Werbebannerentwurf</title>
  <desc id="desc">Mobiler Bannerentwurf mit dem Text Berlin is calling. Where to? und einem Hinweis auf verantwortungsvollen Genuss ab 18 Jahren.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21192a"/>
      <stop offset=".62" stop-color="#14111a"/>
      <stop offset="1" stop-color="#101b1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc87ff"/>
      <stop offset="1" stop-color="#f0bd68"/>
    </linearGradient>
  </defs>
  <rect width="320" height="100" rx="10" fill="url(#background)"/>
  <path d="M0 0h5v100H0z" fill="url(#accent)"/>
  <g fill="none" stroke="#bc87ff" stroke-opacity=".13" stroke-width="1">
    <path d="m178 100 48-100m-17 100 48-100m-17 100 48-100m-17 100 48-100"/>
    <path d="M176 24h144M176 51h144M176 78h144" stroke="#fff" stroke-opacity=".07"/>
  </g>
  <g transform="translate(15 14)">
    <rect width="18" height="18" rx="5" fill="#bc87ff"/>
    <text x="9" y="13.5" text-anchor="middle" fill="#170f22" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900">Q</text>
    <text x="25" y="13" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing=".8">QUEUE <tspan fill="#bc87ff">BERLIN</tspan></text>
    <text x="143" y="13" fill="#d2c8d8" font-family="Arial, Helvetica, sans-serif" font-size="8.5" letter-spacing=".2">× BERLINER PILSNER</text>
  </g>
  <text x="15" y="56" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" letter-spacing="-.35">Berlin is calling.</text>
  <text x="15" y="75" fill="#d3a9ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" letter-spacing="-.35">Where to?</text>
  <text x="15" y="91" fill="#aaa4b4" font-family="Arial, Helvetica, sans-serif" font-size="6.8" font-weight="700" letter-spacing=".65">WERBEENTWURF · 18+ · VERANTWORTUNGSVOLL GENIESSEN</text>
  <rect x="211" y="46" width="96" height="30" rx="6" fill="#bc87ff"/>
  <text x="259" y="64.5" text-anchor="middle" fill="#170f22" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">CLUBS ENTDECKEN ↗</text>
</svg>
