<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90" role="img" aria-labelledby="title desc">
  <title id="title">Queue Berlin x Berliner Pilsner – Werbebanner-Konzept</title>
  <desc id="desc">Bannerentwurf mit dem Text Berlin is calling. Where to? und einem Hinweis auf verantwortungsvollen Genuss ab 18 Jahren.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21192a"/>
      <stop offset=".58" stop-color="#14111a"/>
      <stop offset="1" stop-color="#101b1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc87ff"/>
      <stop offset="1" stop-color="#f0bd68"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 16h32M16 0v32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="728" height="90" rx="12" fill="url(#background)"/>
  <rect width="728" height="90" rx="12" fill="url(#grid)"/>
  <path d="M0 0h8v90H0z" fill="url(#accent)"/>
  <path d="M442 0h286v90H442z" fill="#fff" opacity=".018"/>
  <g fill="none" stroke="#bc87ff" stroke-opacity=".2" stroke-width="1">
    <path d="M442 90 500 0m-16 90 58-90m-16 90 58-90m-16 90 58-90m-16 90 58-90m-16 90 58-90"/>
    <path d="M452 20h276M442 48h286M442 74h286" stroke="#fff" stroke-opacity=".08"/>
  </g>
  <g transform="translate(24 18)">
    <rect width="19" height="19" rx="5" fill="#bc87ff"/>
    <text x="9.5" y="14" text-anchor="middle" fill="#170f22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">Q</text>
    <text x="27" y="13.5" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">QUEUE <tspan fill="#bc87ff">BERLIN</tspan></text>
    <text x="156" y="13.5" fill="#d2c8d8" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing=".6">× BERLINER PILSNER</text>
  </g>
  <text x="24" y="59" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="750" letter-spacing="-.6">Berlin is calling. <tspan fill="#d3a9ff">Where to?</tspan></text>
  <text x="25" y="77" fill="#aaa4b4" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="1.25">UNVERBINDLICHER WERBEENTWURF</text>
  <g transform="translate(468 17)">
    <circle cx="14" cy="14" r="13" fill="#bc87ff" fill-opacity=".12" stroke="#bc87ff" stroke-opacity=".55"/>
    <path d="M14 7v14m-5-7h10" stroke="#d3a9ff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="12" fill="#d4cbdc" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="1.3">YOUR NIGHT,</text>
    <text x="36" y="25" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing=".4">YOUR BERLIN</text>
    <text x="0" y="48" fill="#aaa4b4" font-family="Arial, Helvetica, sans-serif" font-size="7.5">18+ · Bitte verantwortungsvoll genießen</text>
  </g>
  <rect x="602" y="28" width="105" height="35" rx="7" fill="#bc87ff"/>
  <text x="654.5" y="49.5" text-anchor="middle" fill="#170f22" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">CLUBS ENTDECKEN ↗</text>
</svg>
